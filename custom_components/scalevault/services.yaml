log_feeding:
  name: Log feeding
  description: >-
    Log a feeding in ScaleVault. Additive only — creates a new record,
    never edits or deletes one.
  fields:
    target:
      name: Target
      description: >-
        Animal code (e.g. A-0001) or enclosure code (e.g. E-0004) — a
        single-animal enclosure resolves to that animal automatically.
        Leave blank to use the "Feeding target" select entity's current pick.
      required: false
      example: "A-0001"
      selector:
        text:
    notes:
      name: Notes
      description: Optional note to attach to the log entry.
      required: false
      selector:
        text:

