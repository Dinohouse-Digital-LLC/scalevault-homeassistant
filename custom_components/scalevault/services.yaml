log_action:
  name: Log action key
  description: >-
    Trigger an action key configured in ScaleVault under Settings → Home
    Assistant, instead of a fixed action/target. What the key actually does
    (which action(s), which target(s)) is edited there, not here — so
    reassigning a button doesn't require changing this automation. A key can
    map to more than one action and/or target; ScaleVault performs every
    combination and this service raises an error naming any that failed.
  fields:
    key:
      name: Key
      description: The action key's name, as configured in ScaleVault.
      required: true
      example: "button_1"
      selector:
        text:
    notes:
      name: Notes
      description: >-
        Optional note to attach to the log entry(ies). Overrides the key's
        configured notes, if any.
      required: false
      selector:
        text:
